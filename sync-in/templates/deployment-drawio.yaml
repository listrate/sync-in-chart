{{- if .Values.drawio.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sync-in.drawio-name" . }}
  labels:
    {{- include "sync-in.labels" . | nindent 4 }}
    app.kubernetes.io/component: drawio
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "sync-in.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: drawio
  template:
    metadata:
      labels:
        {{- include "sync-in.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: drawio
    spec:
      serviceAccountName: {{ include "sync-in.fullname" . }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      securityContext:
        {{- toYaml .Values.drawio.podSecurityContext | nindent 8 }}
      containers:
        - name: drawio
          image: "{{ .Values.drawio.image.repository }}:{{ .Values.drawio.image.tag }}"
          imagePullPolicy: {{ .Values.drawio.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            {{- toYaml .Values.drawio.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.drawio.securityContext | nindent 12 }}
      {{- with .Values.drawio.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.drawio.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.drawio.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
