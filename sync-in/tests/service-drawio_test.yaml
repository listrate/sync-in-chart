suite: service drawio
templates:
  - templates/service-drawio.yaml
tests:
  - it: renders when drawio is enabled
    set:
      drawio.enabled: true
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: RELEASE-NAME-sync-in-drawio
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0].port
          value: 8080
      - equal:
          path: spec.ports[0].targetPort
          value: http

  - it: does not render when drawio is disabled
    set:
      drawio.enabled: false
    asserts:
      - hasDocuments:
          count: 0
